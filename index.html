<!DOCTYPE html>
<html lang="en" class="dark h-full w-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DiTA</title>
    <link data-trunk rel="icon" href="assets/favicon/favicon.ico">
    <link data-trunk rel="rust" data-bin="institution-portal" href="apps/institution-portal/Cargo.toml" data-wasm-opt="z" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-foreground: var(--foreground);
            --color-card: var(--card);
            --color-card-foreground: var(--card-foreground);
            --color-popover: var(--popover);
            --color-popover-foreground: var(--popover-foreground);
            --color-primary: var(--primary);
            --color-primary-foreground: var(--primary-foreground);
            --color-secondary: var(--secondary);
            --color-secondary-foreground: var(--secondary-foreground);
            --color-muted: var(--muted);
            --color-muted-foreground: var(--muted-foreground);
            --color-accent: var(--accent);
            --color-accent-foreground: var(--accent-foreground);
            --color-border: var(--border);
            --color-input: var(--input);
            --color-ring: var(--ring);
            --color-none: var(--none);
            --color-avail: var(--avail);
            --color-avail-foreground: var(--avail-foreground);
            --color-unavail: var(--unavail);
            --color-unavail-foreground: var(--unavail-foreground);
            --color-pref: var(--pref);
            --color-pref-foreground: var(--pref-foreground);
            --color-undesired: var(--avail);
            --color-undesired-foreground: var(--avail-foreground);

            --font-sans: 'Inter', system-ui, sans-serif;
        }
        @layer base {
            :root {
                --radius: 0.5rem;
                --font-sans: 'Inter', sans-serif;
                --bg-gradient: radial-gradient(circle at bottom right, #e2f1e7 0%, #ffffff 100%);
                --foreground: oklch(0.235 0 0);
                --card: oklch(0.802 0 0);
                --card-foreground: oklch(0.145 0 0);
                --popover: oklch(0.802 0 0);
                --popover-foreground: oklch(0.145 0 0);
                --muted: oklch(0.77 0 0);
                --muted-foreground: oklch(0.556 0 0);
                --accent: oklch(0.77 0 0);
                --accent-foreground: oklch(0.205 0 0);
                --border: oklch(0.786 0 0);
                --input: oklch(0.922 0 0);
                --ring: oklch(0.708 0 0);
                --primary: oklch(0.511 0.096 186.391);
                --primary-foreground: oklch(0.786 0.022 196.714);
                --secondary: oklch(0.77 0 0);
                --secondary-foreground: oklch(0.21 0.006 285.885);
                --none: oklch(0.521 0 0 / 0.1);
                --avail: oklch(0.904 0.036 145.269);
                --avail-foreground: oklch(0.277 0 0);
                --unavail: oklch(0.843 0.026 17.68);
                --unavail-foreground: oklch(0.277 0 0);
                --pref: oklch(0.964 0.018 134.92);
                --pref-foreground: oklch(0.277 0 0);
                --undesired: oklch(0.967 0.029 100.575);
                --undesired-foreground: oklch(0.277 0 0);
            }

            .dark {
                --bg-gradient: radial-gradient(circle at bottom right, #0e2503 0%, #000000 100%);
                --foreground: oklch(0.848 0 0);
                --card: oklch(0.205 0 0);
                --card-foreground: oklch(0.802 0 0);
                --popover: oklch(0.205 0 0);
                --popover-foreground: oklch(0.802 0 0);
                --muted: oklch(0.269 0 0);
                --muted-foreground: oklch(0.708 0 0);
                --accent: oklch(0.371 0 0);
                --accent-foreground: oklch(0.802 0 0);
                --border: oklch(1 0 0 / 10%);
                --input: oklch(1 0 0 / 15%);
                --ring: oklch(0.556 0 0);
                --primary: oklch(0.437 0.078 188.216);
                --primary-foreground: oklch(0.794 0.011 196.933);
                --secondary: oklch(0.274 0.006 286.033);
                --secondary-foreground: oklch(0.802 0 0);
                --none: oklch(0.64 0 0 / 0.1);
                --avail: oklch(0.269 0.086 142.701);
                --avail-foreground: oklch(0.707 0.149 143.803);
                --unavail: oklch(0.195 0.065 25.618);
                --unavail-foreground: oklch(0.607 0.103 20.51);
                --pref: oklch(0.323 0.105 142.655);
                --pref-foreground: oklch(0.811 0.172 143.789);
                --undesired: oklch(0.334 0.073 109.769);
                --undesired-foreground: oklch(0.805 0.108 108.598);
            }

            body {
                background-image: var(--bg-gradient);
                background-attachment: fixed;
            }
        }
    </style>
</head>
<body class="text-foreground transition-colors duration-500 h-full w-full"></body>
</html>
