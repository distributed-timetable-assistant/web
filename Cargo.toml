[workspace]
members = [
    "crates/*",
    "apps/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Hasan Karimi <me@hasankarimi.ir>"]
license = "proprietary"
homepage = "web.st.dita.hasankarimi.ir"

[workspace.dependencies]
dita-core = { path = "crates/dita-core" }
dita-state = { path = "crates/dita-state" }
dita-design-system = { path = "crates/dita-design-system" }
dita-auth = { path = "crates/dita-auth" }
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"]}
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_ui = "0.3"
leptos-use = "0.19"
reactive_stores = "0.4"
tw_merge = "0.1"
icons = { version = "0.18.3", features = ["leptos", "leptos_animated"] }
web-sys = { version = "0.3", features = ["Storage", "Window", "MediaQueryList"] }
strum = "0.28"
serde = "^1.0"
serde_json = "^1.0"